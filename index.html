<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VidNavigator Status</title>
<meta name="description" content="Live status of the VidNavigator API.">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  :root {
    --bg: #f8f9fc; --card: #ffffff; --ink: #282828; --muted: #6b7280; --line: #e7e8ee;
    --ok: #16a34a; --ok-bg: #e9f8ef; --warn: #d97706; --warn-bg: #fff4de;
    --bad: #dc2626; --bad-bg: #fdecec; --none: #d7d9e0; --none-bg: #f1f2f6;
    --brand-a: #b439ff; --brand-b: #721aff; --accent: #721aff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101116; --card: #191b22; --ink: #f1f2f6; --muted: #9aa0ad; --line: #2a2d38;
      --ok: #34d17a; --ok-bg: #12301f; --warn: #f5a623; --warn-bg: #3a2a0c;
      --bad: #f26b6b; --bad-bg: #3a1616; --none: #3a3e4b; --none-bg: #22252e;
      --accent: #b98cff;
    }
    .logo { filter: invert(1) hue-rotate(180deg); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 28px 0 24px; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .logo { height: 34px; width: auto; display: block; }
  .brand span {
    font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px; color: #fff;
    background: linear-gradient(135deg, var(--brand-a), var(--brand-b));
  }
  nav { display: flex; gap: 18px; font-size: 14px; color: var(--muted); }
  nav a { text-decoration: none; }
  nav a:hover { color: var(--ink); text-decoration: underline; }

  .banner {
    display: flex; align-items: center; gap: 16px; padding: 22px 24px; border-radius: 16px;
    background: var(--none-bg); border: 1px solid var(--line);
  }
  .banner .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--none); flex: none; }
  .banner h1 { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 650; }
  .banner p:empty { display: none; }
  .banner p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .banner.operational { background: var(--ok-bg); border-color: transparent; }
  .banner.operational .dot { background: var(--ok); box-shadow: 0 0 0 5px color-mix(in srgb, var(--ok) 22%, transparent); }
  .banner.checking { background: var(--warn-bg); border-color: transparent; }
  .banner.checking .dot { background: var(--warn); }
  .banner.partial_outage, .banner.outage { background: var(--bad-bg); border-color: transparent; }
  .banner.partial_outage .dot, .banner.outage .dot { background: var(--bad); }

  h2 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 36px 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .component { padding: 18px 20px; border-top: 1px solid var(--line); }
  .component:first-child { border-top: 0; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .name { font-weight: 600; font-size: 16px; }
  .path { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted); margin-left: 8px; }
  .state { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .state.operational { color: var(--ok); }
  .state.checking { color: var(--warn); }
  .state.partial_outage, .state.outage, .state.down { color: var(--bad); }

  .heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 36px 0 12px; }
  .heading h2 { margin: 0; }
  .ranges { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--none-bg); border: 1px solid var(--line); }
  .ranges button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600;
    padding: 4px 12px; border-radius: 999px; cursor: pointer;
  }
  .ranges button:hover { color: var(--ink); }
  .ranges button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }

  .days { display: grid; gap: 2px; margin-top: 12px; height: 30px; }
  .day { border-radius: 2px; background: var(--none); border: 0; padding: 0; cursor: default; min-width: 0; }
  .day.operational { background: var(--ok); }
  .day.checking { background: var(--warn); }
  .day.down { background: var(--bad); }
  .day:hover, .day:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .scale { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; }
  @media (max-width: 640px) {
    nav { display: none; }
  }

  .platforms { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px;
    font-size: 13px; background: var(--none-bg); color: var(--ink);
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--none); }
  .chip.operational i { background: var(--ok); }
  .chip.checking { background: var(--warn-bg); } .chip.checking i { background: var(--warn); }
  .chip.down { background: var(--bad-bg); } .chip.down i { background: var(--bad); }

  [hidden] { display: none !important; }
  .tabs { display: flex; gap: 4px; margin-top: 28px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs a {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; margin-bottom: -1px;
    color: var(--muted); font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap;
    border-bottom: 2px solid transparent;
  }
  .tabs a:hover { color: var(--ink); }
  .tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
  .count {
    min-width: 22px; padding: 0 7px; border-radius: 999px; text-align: center;
    font-size: 12px; line-height: 20px; background: var(--none-bg); color: var(--muted);
  }
  .more { font-size: 14px; font-weight: 600; color: var(--accent); text-decoration: none; }
  .more:hover { text-decoration: underline; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 24px 0 4px; }
  .toolbar .count { background: transparent; padding: 0 0 0 2px; min-width: 0; }
  .ranges button[aria-pressed="true"] .count { color: var(--ink); }
  select {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer;
  }
  h3 { font-size: 15px; font-weight: 650; margin: 28px 0 10px; }

  .incident { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
  .incident:first-child { border-top: 0; }
  .incident i { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--warn); }
  .incident.confirmed i { background: var(--bad); }
  .incident.open i { box-shadow: 0 0 0 4px color-mix(in srgb, var(--bad) 22%, transparent); }
  .incident .body { flex: 1; min-width: 0; }
  .incident strong { font-weight: 600; }
  .incident small { display: block; color: var(--muted); font-size: 13px; }
  .incident time { flex: none; color: var(--muted); font-size: 13px; white-space: nowrap; padding-top: 1px; }
  .badge { display: inline-block; padding: 0 8px; margin-right: 6px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 20px; }
  .badge.down { background: var(--bad-bg); color: var(--bad); }
  .badge.brief { background: var(--warn-bg); color: var(--warn); }
  @media (max-width: 640px) {
    .incident { flex-wrap: wrap; row-gap: 2px; }
    .incident time { order: 3; width: 100%; padding-left: 22px; padding-top: 0; }
  }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; color: var(--muted); font-size: 13px; }
  .pager button {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .pager button:disabled { color: var(--muted); cursor: default; opacity: .5; }
  .empty { padding: 20px; color: var(--muted); }

  #tip {
    position: fixed; z-index: 10; pointer-events: none; display: none; max-width: 260px;
    background: var(--ink); color: var(--bg); padding: 8px 10px; border-radius: 8px; font-size: 13px; line-height: 1.4;
  }
  #tip b { display: block; }
  footer { margin-top: 36px; color: var(--muted); font-size: 13px; }
  footer p { margin: 0 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="https://vidnavigator.com">
      <img class="logo" src="logo.svg" alt="VidNavigator">
      <span>Status</span>
    </a>
    <nav>
      <a href="https://docs.vidnavigator.com">API docs</a>
      <a href="https://vidnavigator.com/contact">Contact</a>
    </nav>
  </header>

  <section id="banner" class="banner" role="status" aria-live="polite">
    <span class="dot"></span>
    <div><h1 id="headline">Loading…</h1><p id="subline"></p></div>
  </section>

  <nav class="tabs" aria-label="Status sections">
    <a href="#overview" id="tab-overview">Overview</a>
    <a href="#incidents" id="tab-history">Incident history <span id="history-count" class="count"></span></a>
  </nav>

  <div id="overview-panel">
    <div class="heading">
      <h2>API endpoints</h2>
      <div id="ranges" class="ranges" role="group" aria-label="Period shown"></div>
    </div>
    <section id="components" class="card"><div class="empty">Loading…</div></section>

    <div class="heading">
      <h2>Recent incidents</h2>
      <a class="more" href="#incidents">View all incidents →</a>
    </div>
    <section id="recent" class="card"><div class="empty">Loading…</div></section>
  </div>

  <div id="history-panel" hidden>
    <div class="toolbar">
      <div id="kinds" class="ranges" role="group" aria-label="Kind of incident"></div>
      <select id="endpoint" aria-label="Endpoint"></select>
    </div>
    <div id="history"><div class="empty">Loading…</div></div>
    <div id="pager" class="pager" hidden>
      <button type="button" id="newer">← Newer</button>
      <span id="page"></span>
      <button type="button" id="older">Older →</button>
    </div>
  </div>

  <footer>
    <p>Times are shown in your local time zone. Days are UTC days.</p>
    <p id="retention" hidden>The history covers the last 90 days.</p>
  </footer>
</div>
<div id="tip" role="tooltip"></div>

<script>
(function () {
  'use strict';
  var DAY = 86400000, STALE_MINUTES = 75, REFRESH_MS = 60000;
  // Period shown and the number of segments it is cut into (half as many on a narrow screen).
  // "All" is the whole history, up to 90 days, cut into the finest round segments that hold it.
  var RANGES = [
    { id: 'all', label: 'All' },
    { id: '24h', label: '24 hours', ms: DAY, cells: 96 },
    { id: '7d', label: '7 days', ms: 7 * DAY, cells: 84 },
    { id: '30d', label: '30 days', ms: 30 * DAY, cells: 90 },
    { id: '90d', label: '90 days', ms: 90 * DAY, cells: 90 }
  ];
  var SEGMENTS = [15 * 60000, 30 * 60000, 3600000, 2 * 3600000, 4 * 3600000, 8 * 3600000, 12 * 3600000, DAY];
  var chosenRange = null;
  var OVERALL = {
    operational: 'All systems operational',
    checking: 'Investigating a possible issue',
    partial_outage: 'Some endpoints are down',
    outage: 'Major outage'
  };
  var COMPONENT = { operational: 'Operational', checking: 'Investigating', partial_outage: 'Partial outage', outage: 'Down' };
  var CHECK = { operational: 'Operational', checking: 'Investigating', down: 'Down' };
  var RECENT = 3, PAGE_SIZE = 10;
  var KINDS = [
    { id: 'all', label: 'All', test: function () { return true; } },
    { id: 'down', label: 'Outages', test: function (group) { return group.confirmed; } },
    { id: 'brief', label: 'Brief disruptions', test: function (group) { return !group.confirmed; } }
  ];
  // What the history tab shows; kept across the page's refreshes.
  var view = { kind: 'all', endpoint: '', page: 0 };
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }
  function ago(ms) {
    var minutes = Math.max(0, Math.round(ms / 60000));
    if (minutes < 1) return 'just now';
    if (minutes < 60) return minutes + ' min ago';
    var hours = Math.floor(minutes / 60);
    if (hours < 48) return hours + ' h ' + (minutes % 60) + ' min ago';
    return Math.floor(hours / 24) + ' days ago';
  }
  function duration(ms) {
    var minutes = Math.max(1, Math.round(ms / 60000));
    if (minutes < 60) return minutes + ' min';
    var hours = Math.floor(minutes / 60);
    if (hours < 48) return hours + ' h ' + (minutes % 60 ? (minutes % 60) + ' min' : '').trim();
    return Math.round(hours / 24) + ' days';
  }
  // English like the rest of the page, in the reader's own time zone.
  var clock = new Intl.DateTimeFormat('en', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZoneName: 'short' });
  var dayName = new Intl.DateTimeFormat('en', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  var hourMinute = new Intl.DateTimeFormat('en', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  var stamp = new Intl.DateTimeFormat('en', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  var monthName = new Intl.DateTimeFormat('en', { month: 'long', year: 'numeric' });

  // The period to show, as { id, label, ms, cells, cell, from }: the reader's choice, else the whole history.
  function currentRange(now, since, narrow) {
    var history = now - since;
    var id = chosenRange || (history < 90 * DAY ? 'all' : '90d');
    var range = RANGES.filter(function (item) { return item.id === id; })[0];
    if (range.id !== 'all') {
      var count = narrow ? range.cells / 2 : range.cells;
      return { id: range.id, label: range.label, ms: range.ms, cells: count, cell: range.ms / count, from: range.label + ' ago' };
    }
    var cells = narrow ? 45 : 90;
    var cell = SEGMENTS.filter(function (size) { return size * cells >= history; })[0] || DAY;
    return { id: 'all', label: 'All', ms: cell * cells, cells: cells, cell: cell, from: 'Since ' + dayName.format(new Date(since)).replace(/, \d{4}$/, '') };
  }

  // The name of one segment: a UTC day (or days), or a span of local time.
  function segmentLabel(start, end) {
    if (end - start >= DAY) {
      var last = end - DAY;
      return last > start ? dayName.format(new Date(start)) + ' to ' + dayName.format(new Date(last)) : dayName.format(new Date(start));
    }
    return stamp.format(new Date(start)) + ' to ' + hourMinute.format(new Date(end));
  }

  // The endpoints an incident shows on.
  function affected(incident) {
    return incident.affected || [incident.component];
  }

  // What happened to one endpoint during one segment, from its incidents.
  function segmentSummary(incidents, start, end, now, since) {
    if (end <= since || start > now) return { state: 'none', text: 'No data' };
    var down = 0, confirmed = 0, brief = 0;
    incidents.forEach(function (incident) {
      var from = Date.parse(incident.started_at);
      var to = incident.resolved_at ? Date.parse(incident.resolved_at) : now;
      if (from >= end || to < start) return;
      if (incident.confirmed_at) {
        confirmed += 1;
        down = Math.max(down, Math.min(to, end) - Math.max(from, start));
      } else {
        brief += 1;
      }
    });
    if (confirmed) return { state: 'down', text: confirmed + (confirmed > 1 ? ' outages' : ' outage') + ', longest ' + duration(down) };
    if (brief) return { state: 'checking', text: brief + (brief > 1 ? ' brief disruptions' : ' brief disruption') };
    return { state: 'operational', text: 'No incident' };
  }

  // Share of the time the endpoint was up, over the period shown.
  function uptime(component, incidents, now, since, range) {
    var from = Math.max(since, now - range.ms);
    var span = (now - from) * component.checks.length;
    if (span <= 0) return null;
    // Platform by platform: two incidents of one platform that overlap count once.
    var spans = {};
    incidents.forEach(function (incident) {
      if (!incident.confirmed_at) return;
      var start = Math.max(Date.parse(incident.started_at), from);
      var end = Math.min(incident.resolved_at ? Date.parse(incident.resolved_at) : now, now);
      var platform = String(incident.check).split(':')[1] || '';
      if (end > start) (spans[platform] = spans[platform] || []).push([start, end]);
    });
    var down = 0;
    Object.keys(spans).forEach(function (platform) {
      var reached = 0;
      spans[platform].sort(function (a, b) { return a[0] - b[0]; }).forEach(function (item) {
        if (item[1] > reached) { down += item[1] - Math.max(item[0], reached); reached = item[1]; }
      });
    });
    var pct = 100 * (1 - down / span);
    return (pct >= 99.995 ? '100' : pct.toFixed(2)) + '% uptime';
  }

  function renderRanges(active, history) {
    var box = $('ranges');
    box.textContent = '';
    RANGES.forEach(function (range) {
      // Past 90 days of history, "All" and "90 days" are the same view.
      if (range.id === 'all' && history >= 90 * DAY) return;
      var button = el('button', null, range.label);
      button.type = 'button';
      button.setAttribute('aria-pressed', range.id === active.id ? 'true' : 'false');
      button.addEventListener('click', function () {
        chosenRange = range.id;
        if (last) render(last);
      });
      box.appendChild(button);
    });
  }

  function renderComponents(status, now) {
    var box = $('components');
    box.textContent = '';
    var since = Date.parse(status.monitoring_since) || now;
    var range = currentRange(now, since, window.matchMedia('(max-width: 640px)').matches);
    var cells = range.cells, cell = range.cell;
    // Segments start on round times (a UTC day, an even hour, a quarter of an hour); the last one holds now.
    var first = Math.ceil(now / cell) * cell - cells * cell;
    renderRanges(range, now - since);
    (status.components || []).forEach(function (component) {
      var own = (status.incidents || []).filter(function (i) { return affected(i).indexOf(component.id) !== -1; });
      // An endpoint added later has its own start: nothing is shown for it before.
      var started = Math.max(since, Date.parse(component.monitoring_since) || 0);
      var node = el('div', 'component');
      var row = el('div', 'row');
      var title = el('div');
      title.appendChild(el('span', 'name', component.name));
      title.appendChild(el('span', 'path', component.path));
      row.appendChild(title);
      row.appendChild(el('span', 'state ' + component.state, COMPONENT[component.state] || component.state));
      node.appendChild(row);

      var days = el('div', 'days');
      days.style.gridTemplateColumns = 'repeat(' + cells + ', 1fr)';
      for (var index = 0; index < cells; index++) {
        var start = first + index * cell;
        var info = segmentSummary(own, start, start + cell, now, started);
        var label = segmentLabel(start, start + cell);
        var segment = el('button', 'day ' + info.state);
        segment.type = 'button';
        segment.dataset.tip = label + '|' + info.text;
        segment.setAttribute('aria-label', label + ': ' + info.text);
        days.appendChild(segment);
      }
      node.appendChild(days);
      var scale = el('div', 'scale');
      scale.appendChild(el('span', null, range.from));
      scale.appendChild(el('span', null, uptime(component, own, now, started, range) || ''));
      scale.appendChild(el('span', null, 'Now'));
      node.appendChild(scale);

      if (component.checks.length > 1) {
        var platforms = el('div', 'platforms');
        component.checks.forEach(function (check) {
          var chip = el('span', 'chip ' + check.state);
          chip.appendChild(el('i'));
          chip.appendChild(document.createTextNode(check.name));
          chip.title = check.name + ': ' + (CHECK[check.state] || check.state);
          platforms.appendChild(chip);
        });
        node.appendChild(platforms);
      }
      box.appendChild(node);
    });
    if (!box.children.length) box.appendChild(el('div', 'empty', 'No data yet.'));
  }

  // The incidents, newest first. Entries that start together are one incident: one line, not one per platform.
  function incidentGroups(status, now) {
    var labels = {};
    (status.components || []).forEach(function (component) {
      component.checks.forEach(function (check) {
        labels[check.id] = { endpoint: component.name, platform: component.checks.length > 1 ? check.name : null };
      });
    });
    var groups = {}, order = [];
    (status.incidents || []).forEach(function (incident) {
      var key = incident.started_at + (incident.confirmed_at ? '|down' : '|brief');
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(incident);
    });
    return order.map(function (key) {
      var members = groups[key];
      var endpoints = [], platforms = {}, also = [], touched = {};
      members.forEach(function (incident) {
        var label = labels[incident.check] || { endpoint: incident.check, platform: null };
        if (!platforms[label.endpoint]) { platforms[label.endpoint] = []; endpoints.push(label.endpoint); }
        if (label.platform && platforms[label.endpoint].indexOf(label.platform) === -1) platforms[label.endpoint].push(label.platform);
        affected(incident).forEach(function (id) { touched[id] = true; });
      });
      // The other endpoints it showed on, in the order of the page.
      (status.components || []).forEach(function (component) {
        var hit = members.some(function (incident) { return affected(incident).indexOf(component.id) > 0; });
        if (hit && endpoints.indexOf(component.name) === -1) also.push(component.name);
      });
      return {
        start: Date.parse(members[0].started_at),
        end: Math.max.apply(null, members.map(function (i) { return i.resolved_at ? Date.parse(i.resolved_at) : now; })),
        open: members.some(function (i) { return !i.resolved_at; }),
        confirmed: !!members[0].confirmed_at,
        title: endpoints.map(function (name) {
          return platforms[name].length ? name + ' (' + platforms[name].join(', ') + ')' : name;
        }).join(' · '),
        also: also,
        touched: touched
      };
    }).sort(function (a, b) { return b.start - a.start; });
  }

  function incidentNode(group, now) {
    var node = el('div', 'incident' + (group.confirmed ? ' confirmed' : '') + (group.open ? ' open' : ''));
    node.appendChild(el('i'));
    var body = el('div', 'body');
    body.appendChild(el('strong', null, group.title));
    var meta = el('small');
    meta.appendChild(el('span', 'badge ' + (group.confirmed ? 'down' : 'brief'),
      group.confirmed ? 'Outage' : (group.open ? 'Investigating' : 'Brief disruption')));
    meta.appendChild(document.createTextNode(group.open
      ? 'Ongoing for ' + duration(now - group.start)
      : (group.confirmed ? 'Back after ' : 'Resolved within ') + duration(group.end - group.start)));
    body.appendChild(meta);
    if (group.also.length) body.appendChild(el('small', null, 'Also affected: ' + group.also.join(', ')));
    node.appendChild(body);
    var when = el('time', null, clock.format(new Date(group.start)));
    when.dateTime = new Date(group.start).toISOString();
    node.appendChild(when);
    return node;
  }

  // Overview: the latest few, the rest is in the history tab.
  function renderRecent(groups, now) {
    var box = $('recent');
    box.textContent = '';
    // An ongoing incident comes first, however old.
    var ongoing = groups.filter(function (group) { return group.open; });
    ongoing.concat(groups.filter(function (group) { return !group.open; })).slice(0, Math.max(RECENT, ongoing.length))
      .forEach(function (group) { box.appendChild(incidentNode(group, now)); });
    if (!groups.length) box.appendChild(el('div', 'empty', 'No incident recorded.'));
  }

  function renderKinds(groups) {
    var box = $('kinds');
    box.textContent = '';
    KINDS.forEach(function (kind) {
      var button = el('button', null, kind.label + ' ');
      button.type = 'button';
      button.appendChild(el('span', 'count', String(groups.filter(kind.test).length)));
      button.setAttribute('aria-pressed', kind.id === view.kind ? 'true' : 'false');
      button.addEventListener('click', function () { view.kind = kind.id; view.page = 0; if (last) render(last); });
      box.appendChild(button);
    });
  }

  function renderEndpoints(status) {
    var select = $('endpoint');
    select.textContent = '';
    var all = el('option', null, 'All endpoints');
    all.value = '';
    select.appendChild(all);
    (status.components || []).forEach(function (component) {
      var option = el('option', null, component.name);
      option.value = component.id;
      select.appendChild(option);
    });
    if (!(status.components || []).some(function (c) { return c.id === view.endpoint; })) view.endpoint = '';
    select.value = view.endpoint;
  }

  // History tab: filtered, one card per month, PAGE_SIZE incidents a page.
  function renderHistory(status, groups, now) {
    renderEndpoints(status);
    var ofEndpoint = groups.filter(function (group) { return !view.endpoint || group.touched[view.endpoint]; });
    renderKinds(ofEndpoint);
    var kind = KINDS.filter(function (item) { return item.id === view.kind; })[0] || KINDS[0];
    var shown = ofEndpoint.filter(kind.test);
    var pages = Math.max(1, Math.ceil(shown.length / PAGE_SIZE));
    view.page = Math.min(view.page, pages - 1);
    var box = $('history');
    box.textContent = '';
    var card = null, month = null;
    shown.slice(view.page * PAGE_SIZE, (view.page + 1) * PAGE_SIZE).forEach(function (group) {
      var name = monthName.format(new Date(group.start));
      if (name !== month) {
        month = name;
        box.appendChild(el('h3', null, name));
        card = el('section', 'card');
        box.appendChild(card);
      }
      card.appendChild(incidentNode(group, now));
    });
    if (!shown.length) {
      var empty = el('section', 'card');
      empty.style.marginTop = '20px';
      empty.appendChild(el('div', 'empty', groups.length ? 'No incident matches these filters.' : 'No incident recorded.'));
      box.appendChild(empty);
    }
    $('pager').hidden = pages < 2;
    $('page').textContent = 'Page ' + (view.page + 1) + ' of ' + pages;
    $('newer').disabled = view.page === 0;
    $('older').disabled = view.page >= pages - 1;
  }

  // The tab in the address (#incidents), so a link opens the history directly.
  function showTab() {
    var onHistory = location.hash === '#incidents';
    $('overview-panel').hidden = onHistory;
    $('history-panel').hidden = !onHistory;
    $('retention').hidden = !onHistory;
    $('tab-overview').setAttribute('aria-current', onHistory ? 'false' : 'page');
    $('tab-history').setAttribute('aria-current', onHistory ? 'page' : 'false');
  }

  function render(status) {
    var now = Date.now();
    var updated = Date.parse(status.updated_at);
    var stale = !updated || now - updated > STALE_MINUTES * 60000;
    var banner = $('banner');
    if (stale) {
      banner.className = 'banner';
      $('headline').textContent = 'Status information is delayed';
      $('subline').textContent = 'Last update ' + ago(now - updated) + '. The states below may be out of date.';
    } else {
      banner.className = 'banner ' + status.overall;
      $('headline').textContent = OVERALL[status.overall] || status.overall;
      $('subline').textContent = '';
    }
    document.title = (stale ? 'Delayed' : (OVERALL[status.overall] || 'Status')) + ' · VidNavigator Status';
    renderComponents(status, now);
    var groups = incidentGroups(status, now);
    $('history-count').textContent = groups.length;
    renderRecent(groups, now);
    renderHistory(status, groups, now);
  }

  function unavailable() {
    $('banner').className = 'banner';
    $('headline').textContent = 'Status data is unavailable';
    $('subline').textContent = 'The status file could not be loaded. Please retry in a few minutes.';
    $('components').innerHTML = '<div class="empty">No data.</div>';
    $('recent').innerHTML = '<div class="empty">No data.</div>';
    $('history').innerHTML = '<section class="card"><div class="empty">No data.</div></section>';
  }

  $('endpoint').addEventListener('change', function () {
    view.endpoint = this.value;
    view.page = 0;
    if (last) render(last);
  });
  function turn(step) {
    view.page += step;
    if (last) render(last);
    $('tab-history').scrollIntoView({ block: 'start' });
  }
  $('newer').addEventListener('click', function () { turn(-1); });
  $('older').addEventListener('click', function () { turn(1); });
  window.addEventListener('hashchange', function () {
    showTab();
    // A link far down the page ("View all incidents") lands on the tabs, not below them.
    if ($('tab-history').getBoundingClientRect().top < 0) $('tab-history').scrollIntoView({ block: 'start' });
  });
  showTab();

  var last = null;
  function load() {
    fetch('status.json?t=' + Math.floor(Date.now() / REFRESH_MS), { cache: 'no-store' })
      .then(function (response) { if (!response.ok) throw new Error(response.status); return response.json(); })
      .then(function (status) { last = status; render(status); })
      .catch(function () { if (last) render(last); else unavailable(); });
  }

  var tip = $('tip');
  function showTip(target) {
    var parts = (target.dataset.tip || '').split('|');
    tip.textContent = '';
    tip.appendChild(el('b', null, parts[0]));
    tip.appendChild(document.createTextNode(parts[1] || ''));
    tip.style.display = 'block';
    var box = target.getBoundingClientRect();
    var left = Math.min(window.innerWidth - tip.offsetWidth - 8, Math.max(8, box.left + box.width / 2 - tip.offsetWidth / 2));
    tip.style.left = left + 'px';
    tip.style.top = Math.max(8, box.top - tip.offsetHeight - 8) + 'px';
  }
  ['mouseover', 'focusin'].forEach(function (name) {
    document.addEventListener(name, function (event) {
      if (event.target.classList && event.target.classList.contains('day')) showTip(event.target);
    });
  });
  ['mouseout', 'focusout', 'scroll'].forEach(function (name) {
    document.addEventListener(name, function () { tip.style.display = 'none'; }, true);
  });

  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
